map $http_accept $webp_suffix {
  default "";
  "~*webp" ".webp";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 40m;

  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    proxy_pass http://backend:3001/healthz;
  }

  location /readyz {
    proxy_pass http://backend:3001/readyz;
  }

  location /internal/ {
    proxy_pass http://backend:3001/internal/;
  }

  # Block internal stage OpenAPI schemas from public production access
  location ~ ^/openapi\.stage.*\.json$ {
    return 404;
  }

  location /api/ {
    proxy_pass http://backend:3001/api/;
  }

  # Immutable caching for content-hashed Vite bundles and self-hosted woff2 fonts
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # 7-day caching + automatic WebP negotiation for clinical body atlas PNGs
  location ~ ^/(clinical-body-atlas-|clinical-source-localization) {
    add_header Cache-Control "public, max-age=604800" always;
    add_header Vary "Accept" always;
    try_files $uri$webp_suffix $uri =404;
  }

  # Always revalidate SPA entry HTML without disabling bfcache
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
